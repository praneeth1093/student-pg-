<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">
            <img src="/uploads/{{ pg[7] }}"
                 class="img-fluid rounded mb-3"
                 alt="PG Image">

            <h2>{{ pg[2] }}</h2>

            <hr>

            <h5>📍 Location</h5>
            <p>{{ pg[3] }}</p>

            <h5>💰 Rent</h5>
            <p>₹{{ pg[4] }}/month</p>

            <h5>👥 Gender</h5>
            <p>{{ pg[5] }}</p>

            <h5>📝 Description</h5>
            <p>{{ pg[6] }}</p>

            <a href="/pgs" class="btn btn-secondary">
                Back to PG List
            </a>

        </div>

    </div>

</div>

</body>
</html>
