<!DOCTYPE html>
<html>
<head>
    <title>Edit PG</title>
</head>
<body>

<h2>Edit PG Details</h2>

<form method="POST">

    <label>PG Name</label><br>
    <input type="text" name="pg_name" value="{{ pg[2] }}" required><br><br>

    <label>Location</label><br>
    <input type="text" name="location" value="{{ pg[3] }}" required><br><br>

    <label>Rent</label><br>
    <input type="number" name="rent" value="{{ pg[4] }}" required><br><br>

    <label>Gender</label><br>
    <select name="gender">

        <option value="Boys"
        {% if pg[5]=="Boys" %}selected{% endif %}>
        Boys
        </option>

        <option value="Girls"
        {% if pg[5]=="Girls" %}selected{% endif %}>
        Girls
        </option>

        <option value="Both"
        {% if pg[5]=="Both" %}selected{% endif %}>
        Both
        </option>

    </select>

    <br><br>

    <label>Description</label><br>

    <textarea name="description" rows="5" cols="40">{{ pg[6] }}</textarea>

    <br><br>

    <button type="submit">Update PG</button>

</form>

<br>

<a href="/owner_dashboard">← Back to Dashboard</a>

</body>
