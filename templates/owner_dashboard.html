<table class="table table-bordered">

<tr>
    <th>PG Name</th>
    <th>Location</th>
    <th>Rent</th>
    <th>Actions</th>
</tr>

{% for pg in pgs %}

<tr>

    <td>{{ pg[1] }}</td>
    <td>{{ pg[2] }}</td>
    <td>₹{{ pg[3] }}</td>

    <td>
        <a href="/edit_pg/{{ pg[0] }}" class="btn btn-warning">
            Edit
        </a>

        <a href="/delete_pg/{{ pg[0] }}" class="btn btn-danger">
            Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>
