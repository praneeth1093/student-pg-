<!DOCTYPE html>
<html>
<head>
    <title>Owner Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>Owner Dashboard</h2>

<a href="/add_pg" class="btn btn-success">
    Add New PG
</a>

<hr>

<h3>Your PGs</h3>

<table class="table table-bordered">

<tr>
    <th>PG Name</th>
    <th>Location</th>
    <th>Rent</th>
</tr>

{% for pg in pgs %}

<tr>
    <td>{{ pg[0] }}</td>
    <td>{{ pg[1] }}</td>
    <td>₹{{ pg[2] }}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
