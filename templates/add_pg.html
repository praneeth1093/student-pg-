```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add PG | Student PG</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Your PG</h1>

    <form action="/add_pg" method="POST" enctype="multipart/form-data">

        <label>PG Name</label>
        <input
            type="text"
            name="pg_name"
            placeholder="Enter PG name"
            required
        >

        <label>Location</label>
        <input
            type="text"
            name="location"
            placeholder="Enter PG location"
            required
        >

        <label>Monthly Rent</label>
        <input
            type="number"
            name="rent"
            placeholder="Enter monthly rent"
            required
        >

        <label>Total Rooms</label>
        <input
            type="number"
            name="total_rooms"
            placeholder="Enter total rooms"
            min="1"
            required
        >

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Both">Both</option>
        </select>

        <label>Description</label>
        <textarea
            name="description"
            placeholder="Describe your PG"
            required
        ></textarea>

        <label>PG Images</label>
        <input
            type="file"
            name="images"
            multiple
            accept="image/*"
        >

        <button type="submit">
            Add PG
        </button>

    </form>

</div>

</body>
</html>
