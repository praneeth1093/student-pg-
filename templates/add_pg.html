<!DOCTYPE html>
<html>
<head>
    <title>Add PG</title>
</head>
<body>

<h2>Add New PG</h2>

<form action="/add_pg" method="POST" enctype="multipart/form-data">

    <label>PG Name:</label><br>
    <input type="text" name="pg_name" required><br><br>

    <label>Location:</label><br>
    <input type="text" name="location" required><br><br>

    <label>Rent:</label><br>
    <input type="number" name="rent" required><br><br>

    <label>Total Rooms:</label><br>
    <input type="number" name="total_rooms" required><br><br>

    <label>Gender:</label><br>
    <select name="gender" required>
        <option value="Boys">Boys</option>
        <option value="Girls">Girls</option>
        <option value="Boys & Girls">Boys & Girls</option>
    </select>
    <br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="4" cols="40"></textarea>
    <br><br>

    <label>PG Image:</label><br>
    <input type="file" name="images" multiple required>
    <br><br>

    <button type="submit">Add PG</button>

</form>

</body>
</html>
