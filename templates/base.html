<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HomelyHub{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Page CSS -->
    {% block css %}{% endblock %}

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🏠 HomelyHub
    </div>

    <ul class="nav-links">

        <li><a href="/">Home</a></li>

        <li><a href="/pgs">Explore PGs</a></li>

        <li><a href="/owner/login">Owner</a></li>

        <li><a href="/login">Student</a></li>

    </ul>

    <a href="/register" class="btn-register">
        Register
    </a>

</nav>

<!-- ================= PAGE CONTENT ================= -->

{% block content %}
{% endblock %}

<!-- ================= FOOTER ================= -->

<footer>

    <h2>🏠 HomelyHub</h2>

    <p>Helping students find the best PG accommodation.</p>

    <p>© 2026 HomelyHub. All Rights Reserved.</p>

</footer>

</body>

</html>
